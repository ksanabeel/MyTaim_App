workflows:
  ios-app-build:
    name: iOS App Build
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build React web assets
        script: npm run build
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Initialize Mac Keychain
        script: keychain initialize
      - name: Fetch and Create Apple Certificates
        script: |
          app-store-connect fetch-signing-files "com.bookonmap.app" \
            --type IOS_APP_STORE \
            --issuer-id "314b845c-2ece-4748-99b7-232bf4d7f49a" \
            --key-id "FQT53Y62GB" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" \
            --create
      - name: Set up Code Signing
        script: xcode-project use-profiles
      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
