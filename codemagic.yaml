workflows:
  ios-app-build:
    name: iOS App Build
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build React web assets
        script: npm run build
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Initialize Mac Keychain
        script: keychain initialize
      - name: Fetch and Create Apple Certificates
        script: |
          app-store-connect fetch-signing-files "com.bookonmap.app" \
            --type IOS_APP_STORE \
            --create
      - name: Set up Code Signing
        script: xcode-project use-profiles
      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
